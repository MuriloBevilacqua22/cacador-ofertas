[project]
name = "cacador-ofertas"
version = "0.1.0"
description = "Robô que acompanha promoções de hardware gamer, iPhones e controles"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "selectolax>=0.3.21",
  "pyyaml>=6",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-postgresql>=6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["coletor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
